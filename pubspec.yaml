name: tika_app
description: "TIKA — seu companheiro virtual. Um digipet moderno que acompanha sua rotina, sem precisar cuidar dele."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gerenciamento de estado
  flutter_riverpod: ^2.5.1

  # Persistência local (100% offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Notificações locais "TIKA está te chamando"
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Contagem de passos
  pedometer: ^4.0.1
  permission_handler: ^11.3.1

  # Gráficos (semana de passos, humor)
  fl_chart: ^0.68.0

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0

  # Widget de tela inicial do Android (opcional / avançado — ver widget_setup_guide.md)
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Gerador do ícone do app — ver ICONE_TUTORIAL.md
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Configuração usada pelo pacote flutter_launcher_icons.
# Veja ICONE_TUTORIAL.md para o passo a passo completo.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF4E0"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
